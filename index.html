<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Priyanshu Kumar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: rgb(0, 0, 33);
        color: white;

        font-family: "Poppins", sans-serif;
      }
      nav {
        display: flex;
        justify-content: space-around;
        align-items: center;
        height: 80px;
        background-color: rgb(18, 18, 62);
      }
      nav ul {
        display: flex;
        justify-content: center;
      }
      nav ul li {
        list-style: none;
        margin: 0 23px;
      }
      nav ul li a{
        text-decoration: none;
        color: white;
      }
      nav ul li a:hover{
        color: rgb(157, 157, 244);
        font-size: 1.02rem;
        /* transition-delay: 5ms; */
        /* transition-duration: 50sec; */
      }
      .left {
        font-size: 1.5rem;
      }
      .firstsection {
        display: flex;
        justify-content: space-around;
        margin: 140px 0;
        align-items: center;
      }
      .firstsection > div {
        width: 30%;
      }
      .leftsection {
        font-size: 2rem;
        /* margin: 70px 0; */
      }
      .rightsection img {
        width: 100%;
        height: 100%;
        /* margin: 50px 0; */
      }
      .purple {
        color: rgb(135, 57, 207);
      }
      #element{
        color: rgb(135, 57, 207);
      }
      .secondsection{
        max-width: 80vw;
        margin: auto;
      }
      main hr{
        border: 0;
        background-color: rgb(160, 75, 240);
        height: 1.2px;
        margin: 60px 84px;
      }
      .secondsection h1{
        font-size: 1.7rem;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="left">Priyanshu Portfolio</div>
        <div class="right">
          <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/">About</a></li>
            <li><a href="/">Services</a></li>
            <li><a href="/">Projects</a></li>
            <li><a href="/">Contact me</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <main>
      <section class="firstsection">
        <div class="leftsection">
          Hello,Myself <span class="purple">Priyanshu Kumar</span>
          <div>and I'm a </div>
           <span id="element"></span>
        </div>
        <div class="rightsection">
          <img src="pfbg.png" alt="backgroung_image" />
        </div>
      </section>
<hr>
      <section class="secondsection">
        <span class="text-grey">what i have done so far</span>
        <h1>Work Experience</h1>
      </section>

    </main>
    <script src="https://unpkg.com/typed.js@3.0.0/dist/typed.umd.js"></script>
    <!-- Setup and start animation! -->
  <script>
    var typed = new Typed('#element', {
      strings: ['web developer.', '&amp; a fullstack developer.'],
      typeSpeed: 50,
    });
  </script>
</body>
</html>
